<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to your NOVA account." />
  <title>NOVA | Login</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script type="module" src="../js/auth.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Main navigation">
      <a class="logo" href="../index.html">NOVA.</a>
      <div class="nav-links">
        <a href="../index.html#products">Shop</a>
        <a href="./login.html">Login</a>
        <a href="../cart/index.html">Cart</a>
      </div>
    </nav>
  </header>

  <main class="auth-page container">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="eyebrow">WELCOME BACK</p>
      <h1 id="auth-title">Log in to NOVA</h1>
      <p class="auth-intro">
        Sign in to save your favourite finds and start shopping.
      </p>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="login-email">Email address</label>
          <input
            type="email"
            id="login-email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-field">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            autocomplete="current-password"
            minlength="8"
            required
          />
        </div>

        <button class="btn auth-submit" type="submit">
          Log in
        </button>

        <p id="auth-message" class="auth-message" role="status"
           aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        New to NOVA?
        <a href="./register.html">Create an account</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>NOVA. — Your everyday store.</p>
    </div>
  </footer>
</body>
</html>
