<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your NOVA account." />
  <title>NOVA | Register</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/session.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Main navigation">
      <a class="logo" href="../index.html">NOVA.</a>
      <div class="nav-links">
        <a href="../index.html#products">Shop</a>
        <a href="./login.html">Login</a>
        <a href="../cart/index.html">Cart</a>
      </div>
    </nav>
  </header>

  <main class="auth-page container">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="eyebrow">JOIN NOVA</p>
      <h1 id="auth-title">Create an account</h1>
      <p class="auth-intro">
        Register to start exploring and shopping with NOVA.
      </p>

      <form id="register-form" novalidate>
        <div class="form-field">
          <label for="register-name">Username</label>
          <input
            type="text"
            id="register-name"
            name="name"
            autocomplete="username"
            minlength="2"
            required
          />
          <small>Use letters, numbers or underscores.</small>
        </div>

        <div class="form-field">
          <label for="register-email">Email address</label>
          <input
            type="email"
            id="register-email"
            name="email"
            autocomplete="email"
            required
          />
          <small>Use an email address accepted by Noroff.</small>
        </div>

        <div class="form-field">
          <label for="register-password">Password</label>
          <input
            type="password"
            id="register-password"
            name="password"
            autocomplete="new-password"
            minlength="8"
            required
          />
          <small>At least 8 characters.</small>
        </div>

        <div class="form-field">
          <label for="register-confirm">Confirm password</label>
          <input
            type="password"
            id="register-confirm"
            name="confirmPassword"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>

        <button class="btn auth-submit" type="submit">
          Create account
        </button>

        <p id="auth-message" class="auth-message" role="status"
           aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="./login.html">Log in</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>NOVA. — Your everyday store.</p>
    </div>
  </footer>
</body>
</html>
